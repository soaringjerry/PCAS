name: phase2.5-doing-eval
on:
  pull_request:
    paths: ["cmd/pcas-eval/**", "testdata/phase2_5/doing/**", "scripts/p25-v2-*", ".github/workflows/p25-v2-eval.yml"]
  push:
    branches: [main]
    paths: ["cmd/pcas-eval/**", "testdata/phase2_5/doing/**", "scripts/p25-v2-*", ".github/workflows/p25-v2-eval.yml"]
jobs:
  fake-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./cmd/pcas-eval/...
      - run: python3 scripts/p25-v2-private_test.py
      - run: scripts/p25-v2-run.sh -fake -repeats=3 -workers=4
