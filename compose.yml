name: pcas

x-memory: &memory
  build: .
  image: pcas-memory:local
  init: true
  environment: &environment
    PCAS_DATABASE_URL: postgres://pcas:${PCAS_DB_PASSWORD:?Set PCAS_DB_PASSWORD in .env}@db:5432/pcas?sslmode=disable
    PCAS_MODELS_FILE: /etc/pcas/models.json
    PCAS_MODEL_SETTINGS_FILE: /var/lib/pcas/model-api.json
    PCAS_BLOB_DIR: /var/lib/pcas/blobs
    PCAS_INBOX_DIR: /var/lib/pcas/inbox
    PCAS_CODEX_HOME: /var/lib/pcas/codex
    PCAS_CODEX_BINARY: /usr/local/bin/codex
    PCAS_CHATGPT_DIRECT_ENABLED: ${PCAS_CHATGPT_DIRECT_ENABLED:-false}
    PCAS_CHATGPT_DIR: /var/lib/pcas/chatgpt
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    PCAS_MODEL_API_KEY: ${PCAS_MODEL_API_KEY:-}
  volumes:
    - ${PCAS_MODELS_PATH:-./config/models.example.json}:/etc/pcas/models.json:ro
    - memory-files:/var/lib/pcas

services:
  embeddings:
    profiles: [local-embeddings]
    build: ./services/embeddings
    image: pcas-embeddings:local
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 2
    environment:
      PCAS_EMBEDDING_THREADS: 2
      HF_HUB_DISABLE_PROGRESS_BARS: 1
    volumes:
      - embedding-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 180s
  db:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcas
      POSTGRES_PASSWORD: ${PCAS_DB_PASSWORD:?Set PCAS_DB_PASSWORD in .env}
      POSTGRES_DB: pcas
    volumes:
      - memory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcas -d pcas"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    <<: *memory
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *memory
    restart: unless-stopped
    command: ["serve"]
    environment:
      <<: *environment
      PCAS_HTTP_ADDR: 0.0.0.0:8090
      PCAS_PUBLIC_URL: ${PCAS_PUBLIC_URL:-}
      PCAS_OWNER_ID: ${PCAS_OWNER_ID:?Set PCAS_OWNER_ID in .env}
      PCAS_API_TOKEN: ${PCAS_API_TOKEN:?Set PCAS_API_TOKEN in .env}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      PCAS_WEB_DIR: /app/web/dist
      PCAS_CHATGPT_CALLBACK_BIND: 0.0.0.0
      PCAS_CHATGPT_CALLBACK_PORT: ${PCAS_CHATGPT_CALLBACK_PORT:-1455}
    ports:
      - "${PCAS_BIND_ADDRESS:-127.0.0.1}:${PCAS_PORT:-12352}:8090"
      - "127.0.0.1:${PCAS_CHATGPT_CALLBACK_PORT:-1455}:${PCAS_CHATGPT_CALLBACK_PORT:-1455}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    <<: *memory
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 128
    cpus: 2
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  memory-db:
  memory-files:
  embedding-models:
